name: Build and publish image

on:
  pull_request:
    paths:
      - Containerfile
  pull_request_target:
    types:
      - closed
    paths:
      - Containerfile
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after successful verification
        required: true
        default: false
        type: boolean

concurrency:
  group: caddy-plus-${{ (github.event_name == 'pull_request_target' || inputs.publish) && 'release' || github.run_id }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy-plus
  SOURCE_REVISION: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  TRIVY_VERSION: v0.72.0
  COSIGN_VERSION: v3.0.6

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize build trigger
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'renovate[bot]') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.user.login == 'renovate[bot]')
    steps:
      - name: Record trigger
        run: |
          echo "Build authorized for ${{ github.event_name }} by ${{ github.actor }}"

  verify:
    name: Verify linux/${{ matrix.arch }}
    needs: authorize
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: caddy-plus:test-${{ matrix.arch }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ env.SOURCE_REVISION }}
            IMAGE_VERSION=ci-${{ env.SOURCE_REVISION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Verify image
        env:
          ENGINE: docker
        run: bash tests/verify-image.sh caddy-plus:test-${{ matrix.arch }} ${{ matrix.arch }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Create vulnerability and secret report
        run: |
          trivy image \
            --scanners vuln,secret \
            --format json \
            --output trivy-${{ matrix.arch }}.json \
            caddy-plus:test-${{ matrix.arch }}

      - name: Enforce vulnerability policy
        run: |
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            caddy-plus:test-${{ matrix.arch }}

      - name: Upload scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json
          if-no-files-found: error

  release_metadata:
    name: Select release version
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.user.login == 'renovate[bot]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      patch: ${{ steps.version.outputs.patch }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Read Caddy version
        id: caddy
        run: |
          caddy_version=$(grep -m1 '^ARG CADDY_VERSION=' Containerfile | cut -d= -f2)
          if [[ ! ${caddy_version} =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "invalid CADDY_VERSION: ${caddy_version}" >&2
            exit 1
          fi
          echo "patch=${caddy_version}" >>"${GITHUB_OUTPUT}"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >>"${GITHUB_OUTPUT}"
          echo "major=${BASH_REMATCH[1]}" >>"${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select next immutable revision
        id: version
        env:
          CADDY_PATCH: ${{ steps.caddy.outputs.patch }}
          CADDY_MINOR: ${{ steps.caddy.outputs.minor }}
          CADDY_MAJOR: ${{ steps.caddy.outputs.major }}
        run: |
          revision=1
          while docker manifest inspect "${IMAGE}:${CADDY_PATCH}-${revision}" >/dev/null 2>&1; do
            revision=$((revision + 1))
          done
          echo "version=${CADDY_PATCH}-${revision}" >>"${GITHUB_OUTPUT}"
          echo "patch=${CADDY_PATCH}" >>"${GITHUB_OUTPUT}"
          echo "minor=${CADDY_MINOR}" >>"${GITHUB_OUTPUT}"
          echo "major=${CADDY_MAJOR}" >>"${GITHUB_OUTPUT}"

  publish_architecture:
    name: Publish linux/${{ matrix.arch }} by digest
    needs: release_metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ env.SOURCE_REVISION }}
            IMAGE_VERSION=${{ needs.release_metadata.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Enforce published digest vulnerability policy
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            "${IMAGE}@${DIGEST}"

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable image index
    needs:
      - release_metadata
      - publish_architecture
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Download image digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture image index
        id: index
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
          PATCH_ALIAS: ${{ needs.release_metadata.outputs.patch }}
          MINOR_ALIAS: ${{ needs.release_metadata.outputs.minor }}
          MAJOR_ALIAS: ${{ needs.release_metadata.outputs.major }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${RELEASE_VERSION} already exists; release tags are immutable" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "${digest_file}")")
          done
          [[ ${#sources[@]} -eq 2 ]]

          docker buildx imagetools create \
            --tag "${IMAGE}:${RELEASE_VERSION}" \
            --tag "${IMAGE}:${PATCH_ALIAS}" \
            --tag "${IMAGE}:${MINOR_ALIAS}" \
            --tag "${IMAGE}:${MAJOR_ALIAS}" \
            "${sources[@]}"

          inspection=$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_VERSION}")
          if [[ ! ${inspection} =~ Digest:[[:space:]]+(sha256:[a-f0-9]{64}) ]]; then
            echo "could not determine published image index digest" >&2
            exit 1
          fi
          echo "digest=${BASH_REMATCH[1]}" >>"${GITHUB_OUTPUT}"

      - name: Verify manifest and record digests
        id: digests
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
          PATCH_ALIAS: ${{ needs.release_metadata.outputs.patch }}
          MINOR_ALIAS: ${{ needs.release_metadata.outputs.minor }}
          MAJOR_ALIAS: ${{ needs.release_metadata.outputs.major }}
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          reference="${IMAGE}:${RELEASE_VERSION}@${INDEX_DIGEST}"
          docker buildx imagetools inspect --raw "${reference}" > manifest.json

          amd64_digest=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' manifest.json)
          arm64_digest=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' manifest.json)

          [[ $(jq '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' manifest.json) -eq 2 ]]

          echo "amd64=${amd64_digest}" >>"${GITHUB_OUTPUT}"
          echo "arm64=${arm64_digest}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Published image"
            echo '```text'
            echo "${IMAGE}:${RELEASE_VERSION}@${INDEX_DIGEST}"
            echo "aliases: ${PATCH_ALIAS}, ${MINOR_ALIAS}, ${MAJOR_ALIAS}"
            echo "linux/amd64 ${amd64_digest}"
            echo "linux/arm64 ${arm64_digest}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image index
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${INDEX_DIGEST}"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Scan published architecture images
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
        run: |
          for arch in amd64 arm64; do
            if [[ ${arch} == amd64 ]]; then
              digest=${AMD64_DIGEST}
            else
              digest=${ARM64_DIGEST}
            fi
            subject="${IMAGE}@${digest}"
            trivy image --scanners vuln,secret --format json --output "trivy-${arch}.json" "${subject}"
            trivy image --scanners vuln --format sarif --output "trivy-${arch}.sarif" "${subject}"
            trivy image --scanners vuln --format cosign-vuln --output "trivy-${arch}.cosign.json" "${subject}"
          done

      - name: Attest scan results and verify signature
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
        run: |
          cosign attest --yes --type vuln --predicate trivy-amd64.cosign.json "${IMAGE}@${AMD64_DIGEST}"
          cosign attest --yes --type vuln --predicate trivy-arm64.cosign.json "${IMAGE}@${ARM64_DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${INDEX_DIGEST}"

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-security-${{ needs.release_metadata.outputs.version }}
          path: |
            manifest.json
            trivy-amd64.json
            trivy-amd64.sarif
            trivy-arm64.json
            trivy-arm64.sarif
          if-no-files-found: error

      - name: Upload amd64 SARIF
        if: always() && hashFiles('trivy-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: trivy-amd64.sarif
          category: caddy-plus-amd64

      - name: Upload arm64 SARIF
        if: always() && hashFiles('trivy-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: trivy-arm64.sarif
          category: caddy-plus-arm64
