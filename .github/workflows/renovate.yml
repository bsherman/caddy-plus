name: Verify Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - Containerfile
      - tests/verify-renovate.sh
      - .github/workflows/build.yml
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  verify:
    name: Validate configuration and dependency extraction
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/renovatebot/renovate:44.39.1@sha256:00699dedb6d44bf645e3f0a98729bcdb660a660f1952a53d9592d3a127088b11
      options: --user 1001:1001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Renovate configuration
        run: bash tests/verify-renovate.sh
