name: Verify Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - Containerfile
      - tests/verify-renovate.sh
      - .github/workflows/build.yml
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  verify:
    name: Validate configuration and dependency extraction
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/renovatebot/renovate:44.46.4@sha256:3b64619da15eec8cc7eb7e422698736d6e129bf0832e8b90fe956706cde3c133
      options: --user 1001:1001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Renovate configuration
        run: bash tests/verify-renovate.sh
