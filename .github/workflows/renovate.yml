name: Verify Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - Containerfile
      - tests/verify-renovate.sh
      - .github/workflows/build.yml
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  verify:
    name: Validate configuration and dependency extraction
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/renovatebot/renovate:44.87.1@sha256:4e8c64197947c14df5b44c889aea945f2ad8460bf1bb6c96f339a84c0aff6a38
      options: --user 1001:1001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Renovate configuration
        run: bash tests/verify-renovate.sh
