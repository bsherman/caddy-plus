name: Verify Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - Containerfile
      - tests/verify-renovate.sh
      - .github/workflows/build.yml
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  verify:
    name: Validate configuration and dependency extraction
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/renovatebot/renovate:44.104.2@sha256:c87b1c55ab98286dad9df0c1d84ebe1fbe2a805a68d48dd7a6d577709bf951a7
      options: --user 1001:1001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Renovate configuration
        run: bash tests/verify-renovate.sh
